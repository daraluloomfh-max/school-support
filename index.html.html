<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>(function(){try{var th=localStorage.getItem("theme");if(!th&&window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)th="dark";if(th)document.documentElement.dataset.theme=th;if(localStorage.getItem("lang")==="en"){document.documentElement.lang="en";document.documentElement.dir="ltr"}}catch(e){}})()</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدعم الفني للمنصات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10302c;--muted:#566a64;--bg:#f6f3ec;--card:#fffdf8;--line:#dcd5c4;--brand:#0b5d55;--brand-ink:#fff;--tint:#e3efeb;--sun:#e9a23b;--warn:#b42318;--ok:#0b6b3a;--hero:#0b5d55}
:root[data-theme=dark]{--ink:#e8efe9;--muted:#9db3aa;--bg:#0d1a18;--card:#132422;--line:#2a423d;--brand:#3cb4a6;--brand-ink:#05211d;--tint:#1a3531;--hero:#0a2e2a;--warn:#ff8a7a;--ok:#6fdc9f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.8}
h1,h2{font-family:Cairo,"IBM Plex Sans Arabic",Tahoma,sans-serif}
html{scroll-padding-top:calc(var(--hh,96px) + 16px)}
.brand{position:sticky;top:0;z-index:20;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 18px;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.brand::before{content:""}
.tools{display:flex;gap:8px;justify-self:end}
.tools button{font:600 .9rem "IBM Plex Sans Arabic",sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:99px;min-width:42px;padding:3px 12px;cursor:pointer}
.tools button:hover{border-color:var(--brand)}
.brand img{display:block;width:min(290px,56vw);height:auto;transition:width .2s}
:root[data-theme=dark] .brand img{background:#fff;border-radius:10px;padding:6px 12px}
.hero{position:relative;background:var(--hero) repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 14px);color:#fff;padding:24px 18px 40px}
.hero .in{max-width:880px;margin:0 auto}
.eyebrow{margin:0 0 6px;color:var(--sun);font-weight:700;letter-spacing:.02em}
h1{font-size:clamp(1.5rem,4.2vw,2.1rem);font-weight:800;margin:0 0 4px;line-height:1.3}
.lead{margin:0 0 14px;max-width:58ch;color:rgba(255,255,255,.85);font-size:1rem}
.trust{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.trust li{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:3px 14px;font-size:.92rem}
.wrap{max-width:880px;margin:-20px auto 0;padding:0 18px 64px}
h2{display:flex;align-items:center;gap:10px;font-size:1.25rem;margin:34px 0 14px}
.n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--sun);color:#3a2800;font-size:1rem;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{position:relative;display:flex;align-items:center;gap:14px;text-align:start;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--brand);transform:translateY(-2px)}
.tile[aria-pressed=true]{border-color:var(--brand);background:var(--tint);box-shadow:0 0 0 3px var(--brand)}
.tile[aria-pressed=true]::after{content:"✓";position:absolute;top:10px;inset-inline-end:14px;color:var(--brand);font-weight:800}
.tile b{display:grid;place-items:center;width:52px;height:52px;flex:none;border-radius:14px;background:var(--tint);color:var(--brand);font:800 1.5rem Cairo,sans-serif}
.tile[aria-pressed=true] b{background:var(--brand);color:var(--brand-ink)}
.tile span{display:block;font-weight:700;font-size:1.1rem}
.tile small{color:var(--muted)}
form{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:26px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.row{grid-template-columns:1fr}form{padding:18px}}
label{display:block;font-weight:600;margin:0 0 4px}
.f{margin-bottom:16px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=file]{padding:9px}
textarea{min-height:130px;resize:vertical}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.hint{color:var(--muted);font-size:.9rem;margin-top:3px}
.notice{background:var(--tint);border-inline-start:4px solid var(--sun);padding:10px 14px;border-radius:8px;margin-bottom:18px;font-weight:500}
button.send{font:700 1.05rem Cairo,"IBM Plex Sans Arabic",sans-serif;background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:13px 34px;cursor:pointer}
button.send:hover{filter:brightness(1.08)}
button.send:disabled{opacity:.6;cursor:wait}
@media(max-width:600px){button.send{width:100%}}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;display:none}
.msg.err{display:block;color:var(--warn);border:1.5px solid var(--warn)}
.done{display:none;background:var(--card);border:1.5px solid var(--ok);border-radius:14px;padding:26px}
.done .no{font:800 1.8rem Cairo,sans-serif;color:var(--ok);direction:ltr;display:inline-block}
.trap{position:absolute;left:-9999px;height:0;overflow:hidden}
@media(prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
.ferr{color:var(--warn);font-weight:600;font-size:.92rem;margin-top:5px}
[aria-invalid=true]{border-color:var(--warn);border-width:2px}
.brand.sm img{width:min(200px,50vw)}
@media(max-width:560px){.brand{display:flex;justify-content:space-between;padding:8px 12px;gap:8px}.brand img{width:min(230px,60vw)}.brand.sm img{width:min(170px,48vw)}.tools{gap:6px}.tools button{min-width:34px;padding:3px 8px}}
@media(prefers-reduced-motion:reduce){.brand img{transition:none}}
</style>
</head>

$("mode").onclick = () => { const v = isDark() ? "light" : "dark"; root.dataset.theme = v; try { localStorage.setItem("theme", v); } catch (e) {} paintMode(); };
$("lang").onclick = () => { LANG = LANG === "ar" ? "en" : "ar"; try { localStorage.setItem("lang", LANG); } catch (e) {} applyLang(); };

function fillSel(id, list, ph){
  const sel = $(id), v = sel.value; sel.innerHTML = "";
  if (ph) sel.add(new Option(t("choose"), ""));
  list.forEach(([val, en, ar]) => sel.add(new Option(LANG === "en" ? en : (ar || val), val)));
  if (v) sel.value = v;
}
function buildTiles(){
  $("tiles").innerHTML = "";
  PLATFORMS.forEach(p => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tile"; b.setAttribute("aria-pressed", "false");
    const i = document.createElement("b"); i.textContent = (LANG === "en" && p.icon_en) || p.icon || pname(p).trim().charAt(0).toUpperCase();
    const d = document.createElement("div"), s = document.createElement("span"); s.textContent = pname(p);
    d.append(s);
    if (p.note) { const n = document.createElement("small"); n.textContent = p.note; d.append(n); }
    b.append(i, d);
    b.onclick = () => { choose(p.name); $("f").scrollIntoView({behavior:"smooth"}); $("name").focus({preventScroll:true}); };
    $("tiles").append(b);
  });
  choose($("platform").value);
}
function choose(name){
  $("platform").value = name;
  if (name) setErr("platform", null);
  document.querySelectorAll(".tile").forEach((el, k) => el.setAttribute("aria-pressed", String(PLATFORMS[k].name === name)));
}
function applyLang(){
  root.lang = LANG; root.dir = LANG === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
  const sc = SCHOOL[LANG];
  document.title = t("title") + " – " + sc; $("school").textContent = t("title") + " – " + sc;
  $("logo").alt = t("logoAlt");
  $("lang").textContent = t("langBtn"); $("lang").setAttribute("aria-label", t("langLabel")); $("lang").title = t("langLabel");
  $("btn").textContent = t("send");
  fillSel("role", OPTS.role.map(([v, e]) => [v, e]), true);
  fillSel("grade", GRADES.map(([v, e]) => [v, e]), true);
  fillSel("type", OPTS.type.map(([v, e]) => [v, e]), true);
  fillSel("priority", OPTS.priority.map(([v, e]) => [v, e]), false);
  fillSel("platform", PLATFORMS.map(p => [p.name, p.en || p.name, p.name]), true);
  buildTiles(); paintMode(); clearErrors(); syncGrade(); setHH();
}
$("platform").onchange = e => choose(e.target.value);
applyLang();
const pre = new URLSearchParams(location.search).get("platform");
if (pre && PLATFORMS.some(p => p.name === pre)) choose(pre);

function setHH(){ const b = $("hdr"); if (b) document.documentElement.style.setProperty("--hh", b.offsetHeight + "px"); }
addEventListener("resize", setHH);
$("logo").addEventListener("load", setHH);
$("logo").addEventListener("transitionend", setHH);
addEventListener("scroll", () => $("hdr").classList.toggle("sm", scrollY > 40), {passive:true});   /* الشعار كبير في الأعلى ويصغر عند التمرير */
setHH();

function syncGrade(){
  const r = $("role").value;
  $("gradeWrap").hidden = r === TEACHER_ROLE;
  $("gradeLbl").textContent = t(r === "ولي أمر" ? "gradeParent" : "grade");
  if (r === TEACHER_ROLE) setErr("grade", null);
}
$("role").addEventListener("change", syncGrade);
syncGrade();

function setErr(id, key){
  const c = $(id); if (!c) return;
  let b = c.parentElement.querySelector(".ferr");
  if (!key) { if (b) b.remove(); c.removeAttribute("aria-invalid"); return; }
  if (!b) { b = document.createElement("div"); b.className = "ferr"; b.setAttribute("role", "alert"); c.parentElement.append(b); }
  b.textContent = t(key); c.setAttribute("aria-invalid", "true");
}
function FIELDS(){ return ["name","role","grade","platform","email","phone","type","desc","shot"]; }   /* دالة حتى تعمل قبل أول استدعاء لـ applyLang */
function clearErrors(){ FIELDS().forEach(k => setErr(k, null)); $("msg").className = "msg"; }
FIELDS().forEach(k => { $(k).addEventListener("input", () => setErr(k, null)); $(k).addEventListener("change", () => setErr(k, null)); });
function fail(m){ const e = $("msg"); e.className = "msg err"; e.textContent = m; }

/* تصغير الصورة: خلفية بيضاء حتى لا تصير الصور الشفافة سوداء */
function shrink(file){
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      ok(c.toDataURL("image/jpeg", .75).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error(/hei[cf]/i.test(file.type + file.name) ? t("errHeic") : t("errImg"))); };
    img.src = u;
  });
}

function showDone(ticket){
  $("ticket").textContent = ticket || t("ticketMail");
  $("f").style.display = "none"; $("done").style.display = "block"; $("done").scrollIntoView({behavior:"smooth"});
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  clearErrors();
  const d = Object.fromEntries(new FormData($("f")));
  if (d.website) return showDone("");   /* honeypot: تجاهل صامت (ويجب أن يرفضه Apps Script أيضاً) */
  const teacher = d.role === TEACHER_ROLE;
  if (teacher) d.grade = TEACHER_GRADE;
  const file = $("shot").files[0];

  const bad = [];
  if (!String(d.name||"").trim()) bad.push(["name","errName"]);
  if (!String(d.role||"").trim()) bad.push(["role","errRole"]);
  if (!teacher && !String(d.grade||"").trim()) bad.push(["grade","errGrade"]);
  if (!String(d.platform||"").trim()) bad.push(["platform","errPlatform"]);
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(d.email||"").trim())) bad.push(["email","errEmail"]);
  if (String(d.phone||"").trim() && !/^\+?[\d\s-]{7,18}$/.test(d.phone.trim())) bad.push(["phone","errPhone"]);
  if (!String(d.type||"").trim()) bad.push(["type","errType"]);
  if (!String(d.desc||"").trim() && !file) bad.push(["desc","errDesc"]);
  if (file && !/^image\//.test(file.type) && !/\.(hei[cf]|jpe?g|png|webp|gif)$/i.test(file.name)) bad.push(["shot","errFile"]);
  else if (file && file.size > MAX_FILE_MB * 1048576) bad.push(["shot","errBig"]);
  if (bad.length) { bad.forEach(([id, k]) => setErr(id, k)); $(bad[0][0]).focus(); return; }

  if (file) {
    try { d.image = await shrink(file); } catch (x) { return fail(x.message); }
  }
  if (!SCRIPT_URL) return fail(t("errNoUrl"));

  $("btn").disabled = true; $("btn").textContent = t("sending");
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(SCRIPT_URL, {method:"POST", body: JSON.stringify(d), signal: ctl.signal});
    const raw = await r.text();
    let j = null; try { j = JSON.parse(raw); } catch (x) {}
    /* النجاح فقط عند ok:true صريح، أي رد آخر لا يُعدّ إرسالاً */
    if (!j || j.ok !== true) { const m = new Error(j && j.error ? t("errSend") + " (" + j.error + ")" : t("errBad")); m.shown = true; throw m; }
    showDone(j.ticket ? String(j.ticket) : "");
  } catch (err) {
    fail(err.shown ? err.message : err.name === "AbortError" ? t("errTimeout") : t("errSend"));
    $("btn").disabled = false; $("btn").textContent = t("send");
  } finally { clearTimeout(timer); }
});
</script>
</body>
</html>
